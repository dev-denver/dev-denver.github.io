name: PR Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup project
        uses: ./.github/actions/setup-project
      - name: Format check
        run: npm run format:check
      - name: Generate JSON
        run: npm run generate-json
      - name: Type check
        run: npm run check
      - name: Build
        run: npm run build
